name: Build macOS artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and archive
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: make test

      - name: Build app and disk image
        run: make dmg

      - name: Verify distributable files
        run: |
          file .build/xdr-boost | grep -q "arm64"
          otool -l .build/xdr-boost | grep -A 3 LC_BUILD_VERSION | grep -q "minos 26.0"
          codesign --verify --deep --strict ".build/XDR Boost.app"
          hdiutil verify .build/XDR-Boost.dmg
          mkdir -p dist
          cp .build/XDR-Boost.dmg dist/

      - name: Archive installable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xdr-boost-macos-arm64
          path: dist/XDR-Boost.dmg
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archived artifacts
        uses: actions/download-artifact@v8
        with:
          name: xdr-boost-macos-arm64
          path: dist

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/XDR-Boost.dmg \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/XDR-Boost.dmg \
              --generate-notes --title "XDR Boost $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
